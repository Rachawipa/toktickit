# CI: runs on every PR to main (and on pushes to main).
# Make the "test" job a REQUIRED status check in Settings -> Branches -> main
# (branch protection / ruleset) so a failing test blocks the merge.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Backend - migrate, seed, test
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit?schema=public
        run: |
          npm ci
          npx prisma migrate deploy
          npm run prisma:seed
          npm test

      - name: Frontend - test and build
        working-directory: ./client
        run: |
          npm ci
          npm test
          npm run build

      - name: Docker image builds
        run: docker build -t toktickit:ci .
